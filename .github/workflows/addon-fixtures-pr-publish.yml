name: Publish addon fixture PR images

on:
  workflow_run:
    workflows:
      - Build addon fixtures
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: addon-fixtures-pr-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.fixture }}/pr
    if: >-
      ${{ github.repository == 'openkaiden/openshell-build-image' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          (github.event.workflow_run.path == '.github/workflows/addon-fixtures.yml' ||
           startsWith(github.event.workflow_run.path, '.github/workflows/addon-fixtures.yml@')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read
      packages: write
      attestations: write
      id-token: write
      checks: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - fixture: single-amd64
            artifact: oci-addon-single-amd64
            package: addon-single
            tag_prefix: amd64-
          - fixture: single-arm64
            artifact: oci-addon-single-arm64
            package: addon-single
            tag_prefix: arm64-
          - fixture: platforms
            artifact: oci-addon-platforms
            package: addon-platforms
            tag_prefix: ""
          - fixture: platforms-libc
            artifact: oci-addon-platforms-libc
            package: addon-platforms-libc
            tag_prefix: ""
    env:
      FIXTURE: ${{ matrix.fixture }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE_NAME: ghcr.io/openkaiden/tests/${{ matrix.package }}/pr
      TAG_PREFIX: ${{ matrix.tag_prefix }}
    steps:
      # The completed PR workflow uploads OCI layouts. Never check out or run
      # source from the PR in this package-write workflow.
      - name: Download PR addon fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr-addon

      - name: Validate PR addon fixture
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -f "$RUNNER_TEMP/pr-addon/oci-layout"
          test -f "$RUNNER_TEMP/pr-addon/index.json"
          skopeo inspect --raw "oci:$RUNNER_TEMP/pr-addon:pr" \
            > "$RUNNER_TEMP/source-manifest.json"

          case "$FIXTURE" in
            single-amd64|single-arm64)
              architecture=${FIXTURE#single-}
              jq -e '
                .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                .config.mediaType == "application/vnd.oci.image.config.v1+json"
              ' "$RUNNER_TEMP/source-manifest.json" > /dev/null
              skopeo inspect --config "oci:$RUNNER_TEMP/pr-addon:pr" \
                | jq -e --arg architecture "$architecture" \
                    '.os == "linux" and .architecture == $architecture' > /dev/null
              ;;
            platforms)
              jq -e '
                .mediaType == "application/vnd.oci.image.index.v1+json" and
                (.manifests | length) == 2 and
                (all(.manifests[];
                  .mediaType == "application/vnd.oci.image.manifest.v1+json" and
                  (.annotations // {}) == {})) and
                ([.manifests[] | [.platform.os, .platform.architecture]] | sort) ==
                  [["linux", "amd64"], ["linux", "arm64"]]
              ' "$RUNNER_TEMP/source-manifest.json" > /dev/null
              ;;
            platforms-libc)
              jq -e --arg key ai.openkaiden.openshell-build-image.libc '
                .mediaType == "application/vnd.oci.image.index.v1+json" and
                (.manifests | length) == 4 and
                (all(.manifests[];
                  .mediaType == "application/vnd.oci.image.manifest.v1+json")) and
                ([.manifests[] |
                  [.platform.os, .platform.architecture, .annotations[$key]]] | sort) ==
                  [["linux", "amd64", "glibc"],
                   ["linux", "amd64", "musl"],
                   ["linux", "arm64", "glibc"],
                   ["linux", "arm64", "musl"]]
              ' "$RUNNER_TEMP/source-manifest.json" > /dev/null
              ;;
          esac

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/ghcr-auth.json" ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish PR addon fixture
        id: push
        shell: bash
        run: |
          set -euo pipefail
          reference="$IMAGE_NAME:$TAG_PREFIX$HEAD_SHA"
          skopeo copy --all --retry-times 3 \
            --dest-authfile "$RUNNER_TEMP/ghcr-auth.json" \
            --digestfile "$RUNNER_TEMP/image-digest" \
            "oci:$RUNNER_TEMP/pr-addon:pr" "docker://$reference"
          digest=$(cat "$RUNNER_TEMP/image-digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "Published preview: \`$IMAGE_NAME@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check published PR addon fixture
        shell: bash
        env:
          PUBLISHED_REFERENCE: ${{ steps.push.outputs.reference }}
        run: |
          set -euo pipefail
          skopeo inspect --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            --raw "docker://$PUBLISHED_REFERENCE" \
            > "$RUNNER_TEMP/published-manifest.json"
          if [[ "$FIXTURE" == single-* ]]; then
            jq -e '.mediaType == "application/vnd.oci.image.manifest.v1+json"' \
              "$RUNNER_TEMP/published-manifest.json" > /dev/null
            skopeo inspect --authfile "$RUNNER_TEMP/ghcr-auth.json" \
              --config "docker://$PUBLISHED_REFERENCE" \
              | jq -e --arg architecture "${FIXTURE#single-}" \
                  '.os == "linux" and .architecture == $architecture' > /dev/null
          else
            jq -e '
              .mediaType == "application/vnd.oci.image.index.v1+json" and
              (all(.manifests[];
                .mediaType == "application/vnd.oci.image.manifest.v1+json"))
            ' "$RUNNER_TEMP/published-manifest.json" > /dev/null
            jq -S --arg key ai.openkaiden.openshell-build-image.libc '
              [.manifests[] |
                [.platform.os, .platform.architecture,
                 (.annotations[$key] // null), (.annotations // {})]] | sort
            ' "$RUNNER_TEMP/source-manifest.json" \
              > "$RUNNER_TEMP/source-descriptors.json"
            jq -S --arg key ai.openkaiden.openshell-build-image.libc '
              [.manifests[] |
                [.platform.os, .platform.architecture,
                 (.annotations[$key] // null), (.annotations // {})]] | sort
            ' "$RUNNER_TEMP/published-manifest.json" \
              > "$RUNNER_TEMP/published-descriptors.json"
            diff -u "$RUNNER_TEMP/source-descriptors.json" \
              "$RUNNER_TEMP/published-descriptors.json"
          fi

      - name: Attest PR addon fixture
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish preview check
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_REFERENCE: ${{ steps.push.outputs.reference }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          jq -n \
            --arg name "Addon fixture preview ($FIXTURE)" \
            --arg sha "$HEAD_SHA" \
            --arg image "$IMAGE_NAME@$PUBLISHED_DIGEST" \
            '{name: $name, head_sha: $sha, status: "completed",
              conclusion: "success", output: {title: "PR addon fixture",
              summary: "OCI preview image published and verified.",
              text: ("Image: `" + $image + "`")}}' \
            | gh api "repos/${GITHUB_REPOSITORY}/check-runs" -X POST --input -
