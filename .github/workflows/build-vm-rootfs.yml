name: Build VM rootfs

on:
  workflow_call:
    inputs:
      source-repository:
        description: Repository containing openshell-build-image, its Makefile and E2E tests
        type: string
        default: ${{ github.repository }}
      source-ref:
        description: Source commit or ref to check out (use a full commit SHA across repositories)
        type: string
        default: ${{ github.sha }}
      runner-labels:
        description: JSON array of native Linux ARM64 runner labels
        type: string
        default: '["ubuntu-26.04-arm"]'
      artifact-name:
        description: Rootfs artifact name, unique within the caller workflow run
        type: string
        default: vm-rootfs
      retention-days:
        description: Artifact retention (0 uses the repository default)
        type: number
        default: 0

    secrets:
      source-token:
        description: Optional read token when the source is a different private repository
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source-repository }}
          ref: ${{ inputs.source-ref }}
          token: ${{ secrets.source-token || github.token }}
          persist-credentials: false

      - name: Install Podman
        uses: redhat-actions/podman-install@4a134a65f7324b2d03498c672cd4c6bce93e94b5 # v1.1.1
        with:
          start-service: 'false'

      - name: Build VM rootfs
        run: make build-vm-rootfs

      # Preserve symlinks and executable bits inside the uploaded tarball.
      - name: Upload VM rootfs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: vm-rootfs.tar
          retention-days: ${{ inputs.retention-days }}
