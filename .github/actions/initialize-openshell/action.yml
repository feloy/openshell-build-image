name: "initialize-openshell"
description: "Create private OpenShell state and an isolated command wrapper"
inputs:
  driver:
    description: "Compute driver used to name the run"
    required: true
  artifacts:
    description: "Diagnostic output directory"
    required: true
  library-path:
    description: "macOS driver library directory"
    default: ""
runs:
  using: "composite"
  steps:
    - shell: "bash"
      env:
        E2E_DRIVER: "${{ inputs.driver }}"
        E2E_ARTIFACTS: "${{ inputs.artifacts }}"
        E2E_LIBRARY_PATH: "${{ inputs.library-path }}"
      run: |
        set -euo pipefail
        E2E_DIR=$(mktemp -d "/tmp/osbi-e2e-${E2E_DRIVER}-XXXXXX")
        # Podman sandbox names in v0.1.2 are limited to 19 characters.
        E2E_NAME=$(printf 'e2e-%s-%s' "$E2E_DRIVER" "${E2E_DIR##*-}" | tr '[:upper:]' '[:lower:]')
        E2E_IMAGE="localhost/$E2E_NAME:e2e"
        mkdir -p "$E2E_DIR/bin" "$E2E_ARTIFACTS"
        {
          echo "E2E_DRIVER=$E2E_DRIVER"
          echo "E2E_ARTIFACTS=$E2E_ARTIFACTS"
          echo "E2E_LIBRARY_PATH=$E2E_LIBRARY_PATH"
          echo "E2E_DIR=$E2E_DIR"
          echo "E2E_NAME=$E2E_NAME"
          echo "E2E_IMAGE=$E2E_IMAGE"
        } >> "$GITHUB_ENV"
        # Apply isolated XDG paths only to OpenShell, preserving Podman's store.
        cat > "$E2E_DIR/osenv" <<'SH'
        #!/bin/bash
        set -euo pipefail
        for variable in ${!OPENSHELL_@}; do unset "$variable"; done
        export XDG_CONFIG_HOME="$E2E_DIR/config" XDG_DATA_HOME="$E2E_DIR/data"
        export XDG_STATE_HOME="$E2E_DIR/state" XDG_CACHE_HOME="$E2E_DIR/cache"
        export OPENSHELL_COLOR=never OPENSHELL_PROVISION_TIMEOUT=300
        export OPENSHELL_GATEWAY="$E2E_NAME"
        # macOS system shells can strip inherited DYLD_* variables.
        export DYLD_LIBRARY_PATH="${E2E_LIBRARY_PATH:-}"
        exec "$@"
        SH
        chmod 700 "$E2E_DIR/osenv"
