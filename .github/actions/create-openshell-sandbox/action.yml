name: "create-openshell-sandbox"
description: "Start a retained sandbox and verify that it is ready"
inputs:
  image:
    description: "Image reference or rootfs archive"
    required: true
  policy:
    description: "Sandbox policy file"
    default: "tests/e2e/policy.yaml"
runs:
  using: "composite"
  steps:
    - shell: "bash"
      env:
        SANDBOX_IMAGE: "${{ inputs.image }}"
        SANDBOX_POLICY: "${{ inputs.policy }}"
      run: |
        set -euo pipefail
        touch "$E2E_DIR/sandbox-create-started"
        "$E2E_DIR/osenv" "$E2E_DIR/bin/openshell" sandbox create \
          --name "$E2E_NAME" --from "$SANDBOX_IMAGE" --policy "$SANDBOX_POLICY" \
          --detach --no-tty --no-auto-providers -- /bin/sh -c 'exec sleep 2147483647' \
          > "$E2E_ARTIFACTS/sandbox-create.log" 2>&1
        "$E2E_DIR/osenv" "$E2E_DIR/bin/openshell" sandbox get "$E2E_NAME" --output json \
          > "$E2E_ARTIFACTS/sandbox-get.json"
        jq -e '.phase == "Ready"' "$E2E_ARTIFACTS/sandbox-get.json"
