name: "stop-openshell"
description: "Delete the sandbox and stop the gateway and owned background processes"
runs:
  using: "composite"
  steps:
    - shell: "bash"
      run: |
        set -euo pipefail
        if [ -z "${E2E_DIR:-}" ] || [ ! -d "$E2E_DIR" ]; then exit 0; fi
        failed=0
        if [ -f "$E2E_DIR/sandbox-create-started" ] && \
          "$E2E_DIR/osenv" "$E2E_DIR/bin/openshell" sandbox get "$E2E_NAME" --output json > /dev/null 2>&1; then
          "$E2E_DIR/osenv" "$E2E_DIR/bin/openshell" sandbox delete "$E2E_NAME" \
            > "$E2E_ARTIFACTS/sandbox-delete.log" 2>&1 || failed=1
        fi
        # Background jobs were started in their own process groups using set -m.
        for label in gateway podman-service; do
          pidfile="$E2E_DIR/$label.pid"
          [ -f "$pidfile" ] || continue
          pid=$(cat "$pidfile")
          if kill -0 -- "-$pid" 2> /dev/null; then
            kill -TERM -- "-$pid" 2> /dev/null || true
            for attempt in {1..15}; do
              kill -0 -- "-$pid" 2> /dev/null || break
              sleep 1
            done
            if kill -0 -- "-$pid" 2> /dev/null; then
              kill -KILL -- "-$pid" 2> /dev/null || failed=1
            fi
          fi
        done
        exit "$failed"
