version: 1
# Use a dedicated non-root identity without image-account supplementary groups.
# OpenShell v0.1.2 clears those groups during rootless Podman startup.
process:
  run_as_user: "10001"
  run_as_group: "10001"
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /etc
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
network_policies: {}
